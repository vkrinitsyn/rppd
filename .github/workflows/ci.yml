name: ci

# The tests with each feature set, and the line coverage of them: under the gate fails
# the run. The coverage badge is our own, no third party: drawn from lcov.info and kept
# on the `badges` branch (the coverage job's last step). No Postgres or etcd service:
# the tests need neither (rd_fn.rs test_db, the one that reads test_db_url.local, is
# commented out; the etcd watch tests are in-process).
on:
  push:
    branches-ignore: ["dependabot/**"]   # their pull request runs it
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a branch's newer push cancels its older run; on master each run stands (the badge):
  # a cancelled run there shows as failing
  group: ci-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # default: etcd-embeded; the vanilla etcd client; etcd-provided, lib only (main.rs
        # refuses it); with OpenTelemetry; with the DataFusion client; config table provided
        features:
          - ""
          - "--no-default-features --features etcd-external"
          - "--no-default-features --features etcd-provided --lib"
          - "--features tracer"
          - "--features datafusion"
          - "--features lib-embedded"
    steps:
      - uses: actions/checkout@v7
        with:
          path: rppd
      # the workspace patches etcds to the sibling checkout (../etcd)
      - uses: actions/checkout@v7
        with:
          repository: vkrinitsyn/etcd
          path: etcd
      - uses: dtolnay/rust-toolchain@stable
      # etcds' build.rs compiles its protos; pyo3 links libpython
      # libprotobuf-dev: protoc's google/protobuf/*.proto, which etcd-client's protos import
      # (a recommend of protobuf-compiler, so not there without recommends)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev python3-dev
      - run: cargo test --manifest-path "$GITHUB_WORKSPACE/rppd/rppd/Cargo.toml" ${{ matrix.features }}
      # the gRPC types, their messages and the language they share with rppd
      - run: cargo test --manifest-path "$GITHUB_WORKSPACE/rppd/rppd-common/Cargo.toml"

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the coverage badge's push, to the badges branch
    steps:
      - uses: actions/checkout@v7
        with:
          path: rppd
      - uses: actions/checkout@v7
        with:
          repository: vkrinitsyn/etcd
          path: etcd
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # libprotobuf-dev: protoc's google/protobuf/*.proto, which etcd-client's protos import
      # (a recommend of protobuf-compiler, so not there without recommends)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev python3-dev
      # the gate is the measured 36.80% (2026-10-29, default + tracer,datafusion) rounded
      # down, not 90%: most of the daemon (rd_config, rd_rpc, rd_monitor, ...) runs only
      # against Postgres and etcd, which no test drives yet. Raise it as tests come.
      - run: cargo llvm-cov --manifest-path "$GITHUB_WORKSPACE/rppd/rppd/Cargo.toml" --features tracer,datafusion --lcov --output-path rppd/lcov.info --fail-under-lines 36
      # [coverage] our own badge, no third party: lcov.info's line coverage, drawn by
      # .github/coverage-badge.py and kept on the `badges` branch - one commit, replaced
      # each time - which the README shows. On a push to the default branch only: a pull
      # request measures and gates, no more
      - name: coverage badge
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pct=$(python3 rppd/.github/coverage-badge.py rppd/lcov.info /tmp/badges/coverage.svg)
          cd /tmp/badges
          git init -q -b badges
          git add coverage.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "coverage ${pct}%"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
