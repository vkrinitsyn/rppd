name: audit and geiger

# cargo audit: known vulnerabilities (RustSec) in the dependencies. cargo geiger:
# unsafe code in rppd and rppd-common and in each crate they use, on the run's
# summary page.
# On a push and a pull request (Dependabot's among them), and weekly: an advisory
# can come out with nothing changed here.
on:
  push:
    branches-ignore: ["dependabot/**"]   # their pull request runs it
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # the Cargo.lock in the repository, the one Dependabot updates
      - run: cargo audit

  geiger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rppd
      # the workspace patches etcds to the sibling checkout (../etcd)
      - uses: actions/checkout@v4
        with:
          repository: vkrinitsyn/etcd
          path: etcd
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      # etcds' build.rs compiles its protos; pyo3 links libpython
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler python3-dev
      # a report, not a gate: the counts go to the log and the summary page
      # an absolute path: cargo-geiger 0.14 refuses a relative --manifest-path
      - run: cargo geiger --manifest-path "$GITHUB_WORKSPACE/rppd/rppd/Cargo.toml" --output-format GitHubMarkdown | tee -a "$GITHUB_STEP_SUMMARY"
