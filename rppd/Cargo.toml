
[package]
name = "rppd"
version = "0.2.19"
authors = ["Vladimir Krinitsyn <v.krinitsyn@gmail.com>"]
edition = "2024"
description = "RPPD - Rust Python Postgres"
license = "MIT"

[lib]
name = "rppde" # to use this package as embeded library

[[bin]]
name = "rppd"
path = "src/main.rs"


[dependencies]
slog = { version = "2.8", features=["default", "max_level_debug", "release_max_level_debug"] }
sloggers = "2.2"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "rt", "fs", "time", "signal", "signal-hook-registry" ] }
tokio-stream = { version = "0.1.18", features = ["net"] }
async-trait = "^0.1"
tonic = { version = "0.14", features = ["codegen"] }

uuid = {version= "1.23", features = ["v4"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

bb8-postgres = {version = "0.9.0", features = ["with-chrono-0_4","with-uuid-0_8"]}

thiserror = "2"
# ^0.29, not 0.30: pyo3 0.30 needs Python >= 3.9, and the release still builds the
# glibc 2.31 package on Ubuntu 20.04, whose python3 is 3.8 (ytcluster_dist, 2026-10-20)
pyo3 = { version = "^0.29", features = ["auto-initialize", "uuid"] }

# ^0.22.1: etcd's sibling checkout went to 0.22.1 (owner, 2026-10-29); since 0.21.4 the queue
# registry by stream, and the ETCD-E052 cancel `consume` watches again after
etcds = {version = "^0.24.0"}
etcd-client = { version = "^0.21", optional = true}

sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "chrono"] }

rust-i18n = "4"
cron-parser = "0.12"
dns-lookup = "4.0"
shims = "0.1"
rppd-common = {version = "0.2.4", path = "../rppd-common"}
# [breaker] rppd.yaml applied at startup (schema.rs): SchemaGuard, no hand-written DDL.
# ^2 is on yaml-rust2 (yaml-rust is unmaintained): its Yaml is what migrate_opt takes
schema_guard_tokio = "^2"
yaml-rust2 = { version = "^0.13", default-features = false }
opentelemetry_sdk = { version = "^0.33", features = ["rt-tokio", "trace"], optional = true }
opentelemetry = { version = "^0.33", features = ["trace", "metrics"], optional = true }


[dev-dependencies]
# [q-dead] the etcd-external path's test builds etcd-client's own responses and
# request sender (rd_etcd.rs, external_tests)
etcd-client = { version = "^0.21", features = ["pub-response-field", "build-server"] }

[features]
default = ["etcd-embeded"]

# use embeded etcd server with internal endpoint/binding port reuse with etcd
etcd-embeded = []

# use provided etcd server instance, while rppd use as library and re-used existing endpoints/binding port for either rppd and etcd
etcd-provided = []

# use external etcd server, like valilla implementation. Require etcd client configuration (not fully implemented in RPPD)
# queue messaging wont work in this case, only subscription to key change i.e. topic
etcd-external = ["dep:etcd-client"]

# The RPPD use as a library with config table extranally provided
lib-embedded = []
tracer = ["dep:opentelemetry_sdk", "dep:opentelemetry", "etcds/tracer"]

# expose an Apache DataFusion (aka Ballista) distributed SQL client to python functions as the `DF` variable.
# Requires the python 'ballista' package (pip install ballista) and df_url configured, see RppdConfig::df_url
datafusion = []


[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

opt-level = "z"
lto = "thin"
codegen-units = 1
