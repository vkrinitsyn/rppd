
[package]
name = "rppd"
version = "0.2.5"
authors = ["Vladimir Krinitsyn <v.krinitsyn@gmail.com>"]
edition = "2024"
description = "RPPD - Rust Python Postgres"

[lib]
name = "rppde" # to use this package as embeded library

[[bin]]
name = "rppd"
path = "src/main.rs"


[dependencies]
slog = { version = "2.8", features=["default", "max_level_debug", "release_max_level_info"] }
sloggers = "2.2"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "rt", "fs", "time", "signal", "signal-hook-registry" ] }
tokio-stream = { version = "0.1.18", features = ["net"] }
async-trait = "^0.1"
tonic = { version = "0.14", features = ["codegen"] }

uuid = {version= "1.23", features = ["v4"]}
base64 = "^0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

bb8-postgres = {version = "0.9.0", features = ["with-chrono-0_4","with-uuid-0_8"]}

thiserror = "2"
pyo3 = { version = "^0.29", features = ["auto-initialize", "uuid"] }

etcds = {version = "0.16"}
etcd-client = { version = "^0.19", optional = true}

sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "chrono"] }

rust-i18n = "4"
cron-parser = "0.11"
dns-lookup = "3.0"
shims = "0.1"
rppd-common = {path = "../rppd-common"}
opentelemetry_sdk = { version = "^0.32", features = ["rt-tokio", "trace"], optional = true }
opentelemetry = { version = "^0.32", optional = true }


[features]
default = ["etcd-embeded"]

# use embeded etcd server with internal endpoint/binding port reuse with etcd
etcd-embeded = []

# use provided etcd server instance, while rppd use as library and re-used existing endpoints/binding port for either rppd and etcd
etcd-provided = []

# use external etcd server, like valilla implementation. Require etcd client configuration (not fully implemented in RPPD)
# queue messaging wont work in this case, only subscription to key change i.e. topic
etcd-external = ["dep:etcd-client"]

# The RPPD use as a library with config table extranally provided
lib-embedded = []
tracer = ["dep:opentelemetry_sdk", "dep:opentelemetry", "etcds/tracer"]


[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

opt-level = "z"
lto = "thin"
codegen-units = 1
