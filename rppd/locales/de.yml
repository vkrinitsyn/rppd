# [i18n] rppd's messages in German: one file per language, every key on the same line in
# every file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for them;
# an error's message starts with its code, RPPD-Ennn, the same in every language
_version: 1

# src/main.rs, src/arg_config.rs - the command line
main.name: "RPPD"
main.about: "Rust Python Postgres Discovery: eine Python-Funktion für jede Änderung in PostgreSQL"
main.error: "Fehler: %{err}"
args.usage: "1. Die PostgreSQL-Erweiterung anlegen: rppd.so sowie die sql- und control-Dateien kopieren, dann ihr Create-SQL ausführen - das legt auch einige Tabellen im gewählten Schema an\n2. Beliebig viele Dienste starten; einer davon ist der Master\n3. Einen Trigger auf einer Tabelle anlegen: ein Insert oder Update ruft eine Funktion auf"
args.defaults: "Bis zu einigen optionalen Argumenten, in beliebiger Reihenfolge: das Schema der Erweiterung, in dem die Konfigurationstabelle liegt (wo die Erweiterung installiert ist), mit einem Punkt am Ende; die URL der Datenbankverbindung; IP und Port zum Binden, durch ':' getrennt"
args.more: "und neben diesen dreien noch einige optionale:\n    --node=[UUID dieses Knotens]\n    --cluster=[UUID dieses Clusters]"
args.too_many: "RPPD-E001 zu viele Argumente: %{count}"
args.port: "RPPD-E002 Port im falschen Format: %{value}: %{err}"
args.schema: "RPPD-E003 Schema im falschen Format: %{value}"
args.no_file: "RPPD-E004 %{path}: weder eine Datei noch ein Verzeichnis"

