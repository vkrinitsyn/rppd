# src/rd_monitor.rs - the master's watch
monitor.start: "наблюдение за нодой %{node}"
monitor.not_master: "RPPD-E060 вызванный мастер ответил, что он не мастер"
monitor.call: "RPPD-E061 вызов мастера: %{err}"
monitor.no_conn: "RPPD-E062 нет соединения с хостом мастера: %{err}"
monitor.load: "RPPD-E063 не удалось прочитать мастера из базы: %{err}"
monitor.removed: "удалена строка прежнего мастера, ID %{id}"
monitor.mark: "RPPD-E064 отметка этой ноды мастером: %{err}"
monitor.cleanup: "RPPD-E065 очистка журналов [%{sql}]: %{err}"

# src/rd_fn.rs - a function's run
fn.read_code: "RPPD-E070 код функции %{id} не читается: %{err}"
