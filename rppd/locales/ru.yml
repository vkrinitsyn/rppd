breaker.open: "breaker функции %{id}: ОТКРЫТ (попытка %{attempt}, повтор в %{until}): %{err}"
breaker.half_open: "breaker функции %{id}: полуоткрыт, одна проба"
breaker.closed: "breaker функции %{id}: закрыт, удержанных событий к обработке: %{n}"
breaker.store: "RPPD-E100 breaker: сохранение функции %{id}: %{err}"
breaker.not_queue: "breaker: функция %{id}: %{what} %{queue} - не очередь /q/, ничего не отправлено"
breaker.put: "RPPD-E101 breaker: put %{key}: %{err}"
breaker.give_up: "RPPD-E102 breaker: функция %{id} отказывается от события, попыток: %{n}: %{err}"
breaker.read: "breaker: чтение rppd_function_state: %{err}"
breaker.restored: "breaker: функция %{id} восстановлена в %{state} до %{until}"

# src/rd_shaper.rs - a function's traffic shaper
shaper.limit: "shaper: функция %{id} %{change} (ожидают: %{waiting})"
shaper.store: "RPPD-E110 shaper: сохранение лимита функции %{id}: %{err}"
shaper.release: "shaper: функция %{id} отпускает ожидающий вызов"

