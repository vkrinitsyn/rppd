etcd.not_ready: "RPPD-E041 etcd не готов: %{err}"
etcd.cleanup: "RPPD-E042 очистка очереди [%{key}]: %{err}"
etcd.unwatch: "не удалось убрать наблюдателя %{queue}: etcd ответил %{err}"
etcd.register: "не удалось зарегистрировать наблюдателя %{queue}: etcd ответил %{err}"
etcd.register_silent: "не удалось зарегистрировать наблюдателя %{queue}: etcd не ответил"
etcd.watch_failed: "RPPD-E043 не удалось создать наблюдателя %{queue}: %{err}"
etcd.watch_not_ready: "RPPD-E044 не удалось создать наблюдателя [%{queue}]: etcd не готов: %{err}"
etcd.cancelled: "наблюдение за %{queue} отменено etcd: %{reason}"
etcd.rewatch: "RPPD-E045 не удалось снова наблюдать за %{queue}: %{err}"
