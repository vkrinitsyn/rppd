# [i18n] rppd's messages in Russian: one file per language, every key on the same line in
# every file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for them;
# an error's message starts with its code, RPPD-Ennn, the same in every language
_version: 1

# src/main.rs, src/arg_config.rs - the command line
main.name: "RPPD"
main.about: "Rust Python Postgres Discovery: функция Python на каждое изменение в PostgreSQL"
main.error: "ошибка: %{err}"
args.usage: "1. Создайте расширение PostgreSQL: скопируйте файлы rppd.so, sql и control, затем выполните SQL создания - при этом в выбранной схеме будут созданы несколько таблиц\n2. Запустите сколько угодно экземпляров сервиса; один из них станет мастером\n3. Создайте триггер на таблице: insert или update вызывает функцию"
args.defaults: "До нескольких необязательных аргументов в любом порядке: схема расширения, где находится таблица конфигурации (где установлено расширение), с точкой в конце; URL подключения к базе данных; IP и порт для привязки через ':'"
args.more: "помимо этих трех, еще несколько необязательных:\n    --node=[UUID этой ноды]\n    --cluster=[UUID этого кластера]"
args.too_many: "RPPD-E001 слишком много аргументов: %{count}"
args.port: "RPPD-E002 неверный формат порта: %{value}: %{err}"
args.schema: "RPPD-E003 неверный формат схемы: %{value}"
args.no_file: "RPPD-E004 %{path}: ни файл, ни каталог"

# src/lib.rs - the server
lib.no_ip: "RPPD-E010 для %{bind} не найден IP-адрес"
lib.serve: "RPPD-E011 сервер остановился: %{err}"
lib.bind: "RPPD-E012 разбор %{bind}: %{err}"
lib.lookup: "RPPD-E013 поиск адреса %{bind}"
lib.start_etcd: "запуск RPPD с etcd [%{name}] на %{bind}"
lib.start: "запуск RPPD [%{name}] на %{bind}"
lib.bye: "до свидания"
lib.unwatch: "остановка: наблюдатель %{queue} не отменен: %{err}"
lib.stopped: "остановлен"
lib.follow: "мастер следует за лидером кластера: %{was} -> %{now}"
lib.switch: "передача роли мастер-ноды от этой ноды (ID=%{from}) к ID=%{to}:"

