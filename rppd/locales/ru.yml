fn.code: "python:[\n%{code}\n] входные данные: (%{input})"
fn.update_err: "RPPD-E071 не удалось сохранить ошибку функции: %{err}"
fn.update: "RPPD-E072 не удалось сохранить результат функции: %{err}"

# src/cron.rs - cron jobs
cron.start: "RPPD-E080 запуск задания cron, SQL %{sql}: %{err}"
cron.finish: "RPPD-E081 завершение задания cron, SQL %{sql}: %{err}"
cron.cadence_off: "cadence выключен: в rppd_cron нет его столбцов (%{first})"
cron.parse: "RPPD-E082 разбор cron %{id} [%{cron}]: %{err}"
cron.store_err: "RPPD-E083 не удалось сохранить ошибку задания cron: %{err}"
cron.clear_err: "RPPD-E084 не удалось очистить ошибку задания cron: %{err}"

# src/cadence.rs - cadence runs
cadence.last_seen: "cadence: last_seen для %{queue}: %{err}"
cadence.read: "cadence: чтение сохраненных строк: %{err}"
cadence.master: "cadence: мастер (эпоха %{term}): выполнение начинается с сохраненных строк"
cadence.not_queue_fn: "RPPD-E090 cadence: функция %{id} читает %{queue} - это не очередь /q/"
cadence.no_fn: "RPPD-E091 cadence: нет функции %{id}"
cadence.cron: "RPPD-E092 cadence: cron [%{cron}]: %{err}"
cadence.pp: "cadence: pp %{id} на %{queue} %{from} -> %{to} (попытка %{attempt})"
cadence.not_queue: "cadence: pp %{id}: %{queue} - не очередь /q/, ничего не отправлено"
cadence.store: "RPPD-E093 cadence: сохранение pp %{id}: %{err}"
cadence.put: "RPPD-E094 cadence: put %{key}: %{err}"
cadence.store_err: "RPPD-E095 cadence: сохранение ошибки pp %{id}: %{err}"

# src/rd_breaker.rs - a function's circuit breaker
breaker.hold: "breaker: функция %{id} удерживает событие"
breaker.retry: "breaker: функция %{id} повторяет событие (попытка %{attempt})"
