# [i18n] rppd's messages in Simplified Chinese: one file per language, every key on the same line in
# every file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for them;
# an error's message starts with its code, RPPD-Ennn, the same in every language
_version: 1

# src/main.rs, src/arg_config.rs - the command line
main.name: "RPPD"
main.about: "Rust Python Postgres Discovery：为 PostgreSQL 的每次变更运行一个 Python 函数"
main.error: "错误：%{err}"
args.usage: "1. 创建 PostgreSQL 扩展：复制 rppd.so 及 sql、control 文件，再执行其创建 SQL——这也会在所选 schema 中建几张表\n2. 按需启动任意多个服务；其中一个是 master\n3. 在表上创建触发器：insert 或 update 会调用一个函数"
args.defaults: "最多几个可选参数，顺序不限：扩展所在的 schema（即配置表所在处），以点结尾；数据库连接 URL；绑定的 IP 和端口，用 ':' 分隔"
args.more: "除这三个外，还有几个可选参数：\n    --node=[本节点 UUID]\n    --cluster=[本集群 UUID]"
args.too_many: "RPPD-E001 参数过多：%{count}"
args.port: "RPPD-E002 端口格式错误：%{value}：%{err}"
args.schema: "RPPD-E003 schema 格式错误：%{value}"
args.no_file: "RPPD-E004 %{path}：既不是文件也不是目录"

