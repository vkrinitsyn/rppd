lib.bye: "再见"
lib.unwatch: "停止：%{queue} 的监视未取消：%{err}"
lib.stopped: "已停止"
lib.follow: "master 跟随集群 leader：%{was} -> %{now}"
lib.switch: "把 master 角色从本节点 (ID=%{from}) 交给 ID=%{to}："

