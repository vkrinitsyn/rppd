lib.bye: "bye"
lib.unwatch: "stop: the watcher of %{queue} not cancelled: %{err}"
lib.stopped: "stopped"
lib.follow: "the master follows the cluster's leader: %{was} -> %{now}"
lib.switch: "handing the master role from this node (ID=%{from}) to ID=%{to}:"

