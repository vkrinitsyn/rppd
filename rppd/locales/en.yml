# [i18n] rppd's messages in English: one file per language, every key on the same line in
# every file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for them;
# an error's message starts with its code, RPPD-Ennn, the same in every language
_version: 1

# src/main.rs, src/arg_config.rs - the command line
main.name: "RPPD"
main.about: "Rust Python Postgres Discovery: a Python function for each change in PostgreSQL"
main.error: "error: %{err}"
args.usage: "1. Create the PostgreSQL extension: copy rppd.so and the sql and control files, then run its create SQL - this also creates a few tables in the chosen schema\n2. Run as many services as wanted; one of them is the master\n3. Create a trigger on a table: an insert or update fires a function"
args.defaults: "Up to a few optional arguments, in any order: the extension's schema, where the config table is (where the extension is installed), ending with a dot; the database connection URL; the IP and port to bind to, separated by ':'"
args.more: "and, beside those three, a few more optional ones:\n    --node=[this node's UUID]\n    --cluster=[this cluster's UUID]"
args.too_many: "RPPD-E001 too many arguments: %{count}"
args.port: "RPPD-E002 a port in the wrong format: %{value}: %{err}"
args.schema: "RPPD-E003 a schema in the wrong format: %{value}"
args.no_file: "RPPD-E004 %{path}: neither a file nor a directory"

