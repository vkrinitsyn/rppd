lib.unwatch: "arrêt : l'observateur de %{queue} n'est pas annulé : %{err}"
lib.stopped: "arrêté"
lib.follow: "le maître suit le leader du cluster : %{was} -> %{now}"
lib.switch: "passage du rôle de maître de ce nœud (ID=%{from}) à ID=%{to} :"

