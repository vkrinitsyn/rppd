# [i18n] rppd's messages in French: one file per language, every key on the same line in
# every file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for them;
# an error's message starts with its code, RPPD-Ennn, the same in every language
_version: 1

# src/main.rs, src/arg_config.rs - the command line
main.name: "RPPD"
main.about: "Rust Python Postgres Discovery : une fonction Python pour chaque changement dans PostgreSQL"
main.error: "erreur : %{err}"
args.usage: "1. Créez l'extension PostgreSQL : copiez rppd.so et les fichiers sql et control, puis exécutez son SQL de création - il crée aussi quelques tables dans le schéma choisi\n2. Lancez autant de services que voulu ; l'un d'eux est le maître\n3. Créez un trigger sur une table : un insert ou un update appelle une fonction"
args.defaults: "Quelques arguments facultatifs, dans n'importe quel ordre : le schéma de l'extension, où se trouve la table de configuration (là où l'extension est installée), terminé par un point ; l'URL de connexion à la base ; l'IP et le port d'écoute, séparés par ':'"
args.more: "et, en plus de ces trois, quelques autres facultatifs :\n    --node=[UUID de ce nœud]\n    --cluster=[UUID de ce cluster]"
args.too_many: "RPPD-E001 trop d'arguments : %{count}"
args.port: "RPPD-E002 port au mauvais format : %{value} : %{err}"
args.schema: "RPPD-E003 schéma au mauvais format : %{value}"
args.no_file: "RPPD-E004 %{path} : ni un fichier ni un répertoire"

