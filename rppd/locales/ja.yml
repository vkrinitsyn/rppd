breaker.half_open: "breaker：関数 %{id} 半開：1 回試行"
breaker.closed: "breaker：関数 %{id} クローズ、保留中の %{n} 件のイベントを処理"
breaker.store: "RPPD-E100 breaker：関数 %{id} の保存：%{err}"
breaker.not_queue: "breaker：関数 %{id}：%{what} %{queue} は /q/ キューではないため送信なし"
breaker.put: "RPPD-E101 breaker：put %{key}：%{err}"
breaker.give_up: "RPPD-E102 breaker：関数 %{id} は %{n} 回試行後にイベントを諦めました：%{err}"
breaker.read: "breaker：rppd_function_state の読み込み：%{err}"
breaker.restored: "breaker：関数 %{id} を %{state} に復元（%{until} まで）"

# src/rd_shaper.rs - a function's traffic shaper
shaper.limit: "shaper：関数 %{id} %{change}（待機 %{waiting}）"
shaper.store: "RPPD-E110 shaper：関数 %{id} の上限の保存：%{err}"
shaper.release: "shaper：関数 %{id} が待機中の呼び出しを解放"

