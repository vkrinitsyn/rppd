etcd.not_ready: "RPPD-E041 etcd の準備ができていません：%{err}"
etcd.cleanup: "RPPD-E042 キュー [%{key}] の片付け：%{err}"
etcd.unwatch: "%{queue} のウォッチャーを片付けられません：etcd の応答 %{err}"
etcd.register: "%{queue} のウォッチャーを登録できません：etcd の応答 %{err}"
etcd.register_silent: "%{queue} のウォッチャーを登録できません：etcd が応答しません"
etcd.watch_failed: "RPPD-E043 %{queue} のウォッチャーを作成できません：%{err}"
etcd.watch_not_ready: "RPPD-E044 [%{queue}] のウォッチャーを作成できません：etcd の準備ができていません：%{err}"
etcd.cancelled: "%{queue} の監視が etcd に取り消されました：%{reason}"
etcd.rewatch: "RPPD-E045 %{queue} を再び監視できません：%{err}"
