# [i18n] rppd's messages in Japanese: one file per language, every key on the same line in
# every file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for them;
# an error's message starts with its code, RPPD-Ennn, the same in every language
_version: 1

# src/main.rs, src/arg_config.rs - the command line
main.name: "RPPD"
main.about: "Rust Python Postgres Discovery：PostgreSQL の変更ごとに Python 関数を実行"
main.error: "エラー：%{err}"
args.usage: "1. PostgreSQL 拡張を作成：rppd.so と sql・control ファイルをコピーし、作成用 SQL を実行（選んだスキーマにいくつかのテーブルも作成）\n2. サービスを必要な数だけ起動；そのうち一つがマスター\n3. テーブルにトリガーを作成：insert または update で関数が呼ばれる"
args.defaults: "任意の引数を順不同で数個まで：拡張のスキーマ（設定テーブルのある場所、拡張をインストールした場所）、末尾にドット；データベース接続 URL；バインドする IP とポート（':' 区切り）"
args.more: "この 3 つに加えて、任意のものがいくつか：\n    --node=[このノードの UUID]\n    --cluster=[このクラスターの UUID]"
args.too_many: "RPPD-E001 引数が多すぎます：%{count}"
args.port: "RPPD-E002 ポートの形式が不正：%{value}：%{err}"
args.schema: "RPPD-E003 スキーマの形式が不正：%{value}"
args.no_file: "RPPD-E004 %{path}：ファイルでもディレクトリでもありません"

# src/lib.rs - the server
lib.no_ip: "RPPD-E010 %{bind} の IP アドレスが見つかりません"
lib.serve: "RPPD-E011 サーバーが停止しました：%{err}"
lib.bind: "RPPD-E012 %{bind} の解析：%{err}"
lib.lookup: "RPPD-E013 %{bind} の名前解決"
lib.start_etcd: "etcd 付き RPPD [%{name}] を %{bind} で起動"
lib.start: "RPPD [%{name}] を %{bind} で起動"
lib.bye: "さようなら"
lib.unwatch: "停止：%{queue} のウォッチャーを取り消せません：%{err}"
lib.stopped: "停止しました"
lib.follow: "マスターがクラスターのリーダーに追従：%{was} -> %{now}"
lib.switch: "マスターの役割をこのノード (ID=%{from}) から ID=%{to} へ移譲："

