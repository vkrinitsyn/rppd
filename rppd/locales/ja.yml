# src/rd_monitor.rs - the master's watch
monitor.start: "ノード %{node} を監視中"
monitor.not_master: "RPPD-E060 呼び出したマスターが自分はマスターではないと応答"
monitor.call: "RPPD-E061 マスターの呼び出し：%{err}"
monitor.no_conn: "RPPD-E062 マスターのホストに接続できません：%{err}"
monitor.load: "RPPD-E063 データベースからマスターを読み取れません：%{err}"
monitor.removed: "以前のマスターの行を削除、ID %{id}"
monitor.mark: "RPPD-E064 このノードをマスターに設定：%{err}"
monitor.cleanup: "RPPD-E065 ログの片付け [%{sql}]：%{err}"

# src/rd_fn.rs - a function's run
fn.read_code: "RPPD-E070 関数 %{id} のコードを読めません：%{err}"
fn.run: "%{err}（[%{table}]@%{topic} の実行時）：%{more}"
fn.code: "python:[\n%{code}\n] 入力：(%{input})"
fn.update_err: "RPPD-E071 関数のエラーを保存できませんでした：%{err}"
fn.update: "RPPD-E072 関数の結果を保存できませんでした：%{err}"

# src/cron.rs - cron jobs
cron.start: "RPPD-E080 cron ジョブの開始、SQL %{sql}：%{err}"
cron.finish: "RPPD-E081 cron ジョブの終了、SQL %{sql}：%{err}"
cron.cadence_off: "cadence オフ：rppd_cron に列がありません (%{first})"
cron.parse: "RPPD-E082 cron %{id} [%{cron}] の解析：%{err}"
cron.store_err: "RPPD-E083 cron ジョブのエラーを保存できませんでした：%{err}"
cron.clear_err: "RPPD-E084 cron ジョブのエラーを消去できませんでした：%{err}"

# src/cadence.rs - cadence runs
cadence.last_seen: "cadence：%{queue} の last_seen：%{err}"
cadence.read: "cadence：保存済みの行の読み込み：%{err}"
cadence.master: "cadence：マスター（期 %{term}）：実行は保存済みの行から開始"
cadence.not_queue_fn: "RPPD-E090 cadence：関数 %{id} は %{queue} を消費しますが、/q/ キューではありません"
cadence.no_fn: "RPPD-E091 cadence：関数 %{id} はありません"
cadence.cron: "RPPD-E092 cadence：cron [%{cron}]：%{err}"
cadence.pp: "cadence：%{queue} の pp %{id} %{from} -> %{to}（試行 %{attempt}）"
cadence.not_queue: "cadence：pp %{id}：%{queue} は /q/ キューではないため送信なし"
cadence.store: "RPPD-E093 cadence：pp %{id} の保存：%{err}"
cadence.put: "RPPD-E094 cadence：put %{key}：%{err}"
cadence.store_err: "RPPD-E095 cadence：pp %{id} のエラーの保存：%{err}"

# src/rd_breaker.rs - a function's circuit breaker
breaker.hold: "breaker：関数 %{id} がイベントを保留"
breaker.retry: "breaker：関数 %{id} がイベントを再試行（試行 %{attempt}）"
breaker.new_code: "breaker：関数 %{id} に新しいコード - 今すぐ試行"
