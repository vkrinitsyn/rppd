cfg.connect: "RPPD-E021 接続：%{err}"
cfg.load_fns: "RPPD-E022 関数の読み込み [%{sql}]：%{err}"
cfg.loaded: "%{tables} テーブルと %{topics} トピックに %{fns} 個の関数を読み込み"
cfg.loaded_all: "テーブル [%{tables}] とトピック [%{topics}] に関数 [%{fns}] を読み込み"
cfg.connect_db: "RPPD-E023 %{url} への接続：%{err}"
cfg.load_nodes: "RPPD-E024 クラスターのアクティブノードの読み込み [%{sql}]：%{err}"
cfg.loaded_for: "%{name} に %{what} を読み込み"
cfg.topics: "%{table} のトピック [%{topics}] を検出"
cfg.repeat: "再実行の準備：%{columns}"
cfg.prepared: "準備済み：%{n}"
cfg.created: "クラスターインスタンスを作成"
cfg.start_failed: "RPPD-E025 サーバープロセスが起動しませんでした：%{err}"
cfg.register: "このノードを登録：%{host}、名前 %{name}"
cfg.register_master: "このノードをマスターとして登録：%{host}、名前 %{name}"
cfg.register_failed: "RPPD-E026 このノードの登録：%{err}"
cfg.registered: "登録済み：%{host}"
cfg.mark_master: "このノードをマスターに設定：%{host}、名前 %{name}"
cfg.loading_fns: "関数を読み込み中"
cfg.loading_cron: "cron ジョブを読み込み中"
cfg.invoke: "%{what} を呼び出し"
cfg.queueing: "キューに追加：%{what}"
cfg.no_fn: "RPPD-E027 id %{id} の関数はありません"
