[package]
name = "rppd-common"
version = "0.2.2"
authors = ["Vladimir Krinitsyn <v.krinitsyn@gmail.com>"]
edition = "2024"
description = "RPPD - protibuf types and services"

[dependencies]
async-trait = "^0.1"
tonic = { version = "^0.13", default-features = false, features = ["prost", "codegen", "channel"] }
prost = { version = "^0.13", default-features = false, features = ["derive"] }

serde = { version = "^1.0", default-features = false, features = ["derive", "alloc"] }

[build-dependencies]
tonic-build = { version = "^0.13", features = ["prost-build", "transport", "prost"]}
#protobuf = { version = "3.7.1", features = ["with-bytes"] }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
