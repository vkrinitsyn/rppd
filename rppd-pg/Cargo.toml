
[package]
name = "rppd-pg"
version = "0.2.2"
authors = ["Vladimir Krinitsyn <v.krinitsyn@gmail.com>"]
edition = "2024"
description = "RPPD - Trigger for Postgres"

[lib]
name = "rppd"
crate-type = ["cdylib"] # cdylib

[dependencies]
# Removed chrono - not used in lib.rs
# Removed slog - not used in lib.rs

# Minimal tokio features - only what's actually used for tonic transport + runtime
tokio = { version = "1.25.0", default-features = false, features = ["rt-multi-thread", "sync", "net", "time"] }

async-trait = "^0.1"

# Minimal tonic for gRPC client only
tonic = { version = "0.13.0", default-features = false, features = ["transport", "codegen", "prost"] }

serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

once_cell = "1.9.0"

pgrx = { version = "^0.14", default-features = false }
pgrx-pg-sys = { version = "^0.14" }

rppd-common = { path = "../rppd-common" }

[dev-dependencies]
pgrx-tests = { version = "^0.14", features = ["pg14"]}

[features]
default = ["pg14" ]
pg17 = ["pgrx/pg17"]
pg16 = ["pgrx/pg16"]
pg15 = ["pgrx/pg15"]
pg14 = ["pgrx/pg14"]
pg13 = ["pgrx/pg13"]
pg_test = ["pgrx/pg15", "pgrx-tests/pg15"]

[profile.dev]
panic = "unwind"

[profile.release]
panic = "abort"          # Use abort instead of unwind - saves ~10-20% binary size
opt-level = "z"          # Optimize for size
lto = "fat"              # Full LTO for better dead code elimination
codegen-units = 1        # Single codegen unit for better optimization
strip = "symbols"        # Strip symbols from binary
debug = false            # No debug info in release
