# rppd's tables, as a SchemaGuard schema. THE canonical definition.
#
# There is no hand-written CREATE TABLE for these any more, and no ALTER either.
# Both were the same mistake in two shapes: `CREATE TABLE IF NOT EXISTS` is a
# no-op on an existing table, so new columns needed a second, hand-maintained
# ALTER block that had to be kept in step with the first by memory. A schema
# file has no such halves - it says what should exist, and the one component
# that already knows how to turn that into DDL does it.
#
# ABSENCE MEANS UNCHANGED. Every column an installed cluster has and this file
# does not mention is left alone, and SchemaGuard generates no DROP for it. So
# adding a column here is safe on a database that predates it, and removing a
# line from here does not remove anything from anybody's database.
#
# `@extschema@` is substituted with the configured schema before this is parsed.
database:
  - schema:
    schemaName: "@extschema@"
    tables:

      # ── node registry ────────────────────────────────────────────────────
      - table:
          tableName: rppd_config
          description: App node host binding and master flag; a change notifies the others
          columns:
            - column:
                name: id
                type: serial
                constraint:
                    primaryKey: true
                    nullable: false
            - column:
                name: host
                type: varchar(64)
                constraint:
                    nullable: false
                # SchemaGuard expresses uniqueness as a unique INDEX, not a
                # column constraint. Postgres implements a UNIQUE constraint
                # with a unique index anyway, so the enforcement is identical
                # (ytserv's `on conflict (host)` is resolved by it the same way);
                # the only difference is that it is not listed in
                # pg_constraint, which nothing here reads.
                # `name` is required: an index block without one is no index at
                # all to SchemaGuard ("+" names it idx_<table>_<column>). Without
                # it these three were never made, and every roster upsert failed
                # 42P10 (topology 92_rppd, the nightly of 2026-10-17).
                index:
                    name: "+"
                    unique: true
                description: The node address and port to connect
            - column:
                name: host_name
                type: varchar(64)
                constraint:
                    nullable: false
                index:
                    name: "+"
                    unique: true
                description: Readable name for a node host instance
            - column:
                name: active_since
                type: timestamptz
                defaultValue: current_timestamp
                description: NULL or a future value marks the node inactive
            - column:
                name: max_db_connections
                type: int
                defaultValue: "10"
                constraint:
                    nullable: false
            - column:
                name: master
                type: bool
                index:
                    name: "+"
                    unique: true
                description: "The node acts as cluster coordinator. Used values: true or null"

      # ── functions ────────────────────────────────────────────────────────
          triggers:
            - trigger:
                name: "@extschema@_rppd_config_event"
                event: after insert or update or delete
                when: for each row
                proc: "@extschema@.rppd_event()"
      - table:
          tableName: rppd_function
          description: Python function code, linked table and topic. Modifying a row refreshes the cache.
          columns:
            - column:
                name: id
                type: serial
                constraint:
                    primaryKey: true
                    nullable: false
            - column:
                name: code
                type: text
                constraint:
                    nullable: false
                description: >
                    The python body. Left NOT NULL as rppd declared it: a
                    git-sourced row is inserted with a placeholder and the
                    cluster replaces it, so rppd never sees a row it cannot
                    load. Relaxing this would make "not yet fetched" and
                    "deliberately empty" the same state.
            - column:
                name: checksum
                type: varchar(64)
                constraint:
                    nullable: false
                description: sha256 of the body; rppd refreshes its cache when this changes
            - column:
                name: schema_table
                type: varchar(64)
                constraint:
                    nullable: false
                description: The table whose rppd_event() fires this function; a leading / makes it an etcd watcher
            - column:
                name: topic
                type: varchar(64)
                defaultValue: "''"
                constraint:
                    nullable: false
                description: "empty: per table; .column: per value; any other name: a shared global queue"
            - column:
                name: priority
                type: int
                defaultValue: "1"
                constraint:
                    nullable: false
            - column:
                name: queue
                type: bool
                defaultValue: "true"
                constraint:
                    nullable: false
                description: Execute consecutive events for the same topic in order
            - column:
                name: cleanup_logs_min
                type: int
                defaultValue: "0"
                constraint:
                    nullable: false
                description: Purge rppd_function_log after N minutes; only if fn_logging
            - column:
                name: fn_logging
                type: bool
                defaultValue: "false"
                constraint:
                    nullable: false
            - column:
                name: verbose_debug
                type: bool
                defaultValue: "false"
                constraint:
                    nullable: false
            - column:
                name: env
                type: json
            - column:
                name: sign
                type: json

            # ── [rppd-git] where the body comes from ─────────────────────
            #
            # All nullable with no default, so every existing row keeps
            # source_git NULL and stays exactly what it was: the feature is
            # opt-in per function, not per cluster.
            - column:
                name: source_git
                type: varchar(250)
                description: Git repository URL holding this body. NULL keeps the pasted code authoritative.
            - column:
                name: source_git_ref
                type: varchar(250)
                description: >
                    Branch, tag or commit. NULL means the remote HEAD - a MOVING
                    target, so pin it for anything that matters. Sized like a
                    path, not a name: refs carry slashes and run long, and a
                    truncated ref resolves to the wrong commit or to none.
            - column:
                name: source_git_dir
                type: varchar(250)
                description: Sub-directory inside the repository
            - column:
                name: source_git_file
                type: varchar(250)
                description: The python file holding the body. Required when source_git is set.
            - column:
                name: source_git_depth
                type: int
                description: Shallow clone depth; 0 fetches full history
            - column:
                name: secret_names
                type: text
                description: >
                    [skv] Names in the secret store of the host this function may
                    read as SECRET.get(name), separated by commas or spaces.
                    Names only - never a value. Whoever may write this table
                    decides which function reads which secret: its GRANTs are
                    the boundary.
            - column:
                name: source_secret_name
                type: varchar(80)
                description: >
                    NAME of the KV entry holding credentials for the source.
                    Never a value: this table replicates to every node, so a
                    password written here is published cluster-wide.
            - column:
                name: script_tag
                type: varchar(80)
                description: Short commit the current code was installed from. Written by the cluster, not by hand.

            # ── [rppd-git] which schema the body needs ───────────────────
            - column:
                name: min_schema_version
                type: varchar(80)
                description: >
                    Lowest sge schema version this body runs against, checked
                    against what the WHOLE cluster has deployed before install.
                    Unmet means not installed, with the reason in `error`.
            - column:
                name: schema_git_tag
                type: varchar(80)
                description: The exact sge schema revision this body was written against. A tag is identity, not ordering.
            - column:
                name: error
                type: text
                description: Why this function was last held back or failed to install. NULL when installed.

            # ── [breaker] the circuit breaker (yt-pgxt resilience.md, D3/D4) ──
            #
            # All defaulted to off: a function with breaker_fails = 0 and
            # max_attempts = 0 runs exactly as before.
            - column:
                name: breaker_fails
                type: int
                defaultValue: "0"
                constraint:
                    nullable: false
                description: Failures in a row that open the breaker on a node; 0 = no breaker
            - column:
                name: breaker_slow_ms
                type: int
                defaultValue: "0"
                constraint:
                    nullable: false
                description: A call slower than this counts as a failure; 0 = off
            - column:
                name: breaker_open_sec
                type: int
                defaultValue: "30"
                constraint:
                    nullable: false
                description: How long an open breaker holds events before one probe; doubles per re-open
            - column:
                name: breaker_open_max_sec
                type: int
                defaultValue: "900"
                constraint:
                    nullable: false
                description: The longest the doubling back-off grows to
            - column:
                name: max_attempts
                type: int
                defaultValue: "0"
                constraint:
                    nullable: false
                description: >
                    Attempts per event; a failed event is retried (when the
                    breaker lets events through) until then, and then goes to
                    dlq. 0 = no retry: the error is recorded and the event is
                    done, as before. With retries an etcd message is
                    acknowledged only once it succeeded or was dead-lettered:
                    at-least-once, so functions must be idempotent.
            - column:
                name: notify_q
                type: varchar(256)
                description: A /q/ queue for the transitions of the breaker (open, closed); NULL sends nothing
            - column:
                name: dlq
                type: varchar(256)
                description: A /q/ queue for events that failed max_attempts times; NULL drops them after logging

            # ── [shaper] the traffic shaper (yt-pgxt resilience.md, D5) ───────
            - column:
                name: max_parallel
                type: int
                defaultValue: "0"
                constraint:
                    nullable: false
                description: >
                    The ceiling of the adaptive limit - how many calls of this
                    function may run at once on a node, lowered while it slows
                    down; 0 = no shaping
            - column:
                name: min_parallel
                type: int
                defaultValue: "1"
                constraint:
                    nullable: false
                description: The floor the adaptive limit never goes under
            - column:
                name: target_ms
                type: int
                defaultValue: "0"
                constraint:
                    nullable: false
                description: The latency the limit steers by; 0 = learned (twice the 10th percentile of the last 100 calls)
            - column:
                name: rate_per_sec
                type: int
                defaultValue: "0"
                constraint:
                    nullable: false
                description: A hard cap of calls per second on a node, on top of the limit; 0 = none
            - column:
                name: burst
                type: int
                defaultValue: "1"
                constraint:
                    nullable: false
                description: Calls the rate cap lets through at once after a pause
            - column:
                name: max_backlog
                type: int
                defaultValue: "0"
                constraint:
                    nullable: false
                description: Events waiting on a node over this send one over notice to notify_q (and one under); 0 = none

      # ── execution log ────────────────────────────────────────────────────
          triggers:
            - trigger:
                name: "@extschema@_rppd_function_event"
                event: after insert or update or delete
                when: for each row
                proc: "@extschema@.rppd_event()"
      - table:
          tableName: rppd_function_log
          description: One row per function call, when fn_logging is set
          columns:
            - column:
                name: id
                type: bigserial
                constraint:
                    primaryKey: true
                    nullable: false
            - column:
                name: node_id
                type: int
                constraint:
                    nullable: false
            - column:
                name: fn_id
                type: int
                constraint:
                    nullable: false
            - column:
                name: trig_value
                type: json
            - column:
                name: trig_type
                type: int
                defaultValue: "0"
                constraint:
                    nullable: false
            - column:
                name: started_at
                type: timestamptz
                defaultValue: current_timestamp
                constraint:
                    nullable: false
            - column:
                name: took_ms
                type: bigint
            - column:
                name: output
                type: text
            - column:
                name: error_msg
                type: text

      # ── scheduled functions ──────────────────────────────────────────────
          triggers:
            - trigger:
                name: "@extschema@_rppd_function_log_event"
                event: after insert or update or delete
                when: for each row
                proc: "@extschema@.rppd_event()"
      - table:
          tableName: rppd_cron
          description: Recurring invocations of a function
          columns:
            - column:
                name: id
                type: serial
                constraint:
                    primaryKey: true
                    nullable: false
            - column:
                name: fn_id
                type: int
                constraint:
                    nullable: false
            - column:
                name: cron
                type: varchar(64)
                constraint:
                    nullable: false
            - column:
                name: column_name
                type: varchar(64)
                constraint:
                    nullable: false
            - column:
                name: column_value
                type: text
            - column:
                name: cadence
                type: bool
                defaultValue: "false"
                constraint:
                    nullable: false
            - column:
                name: timeout_sec
                type: int
            - column:
                name: finished_at
                type: timestamptz
            - column:
                name: started_at
                type: timestamptz
            - column:
                name: error_msg
                type: text
            - column:
                name: watch_min
                type: int
                defaultValue: "0"
                constraint:
                    nullable: false
            - column:
                name: retry_sec
                type: int
                defaultValue: "0"
                constraint:
                    nullable: false
            - column:
                name: watch_q
                type: varchar(256)
            - column:
                name: deadline_q
                type: varchar(256)
            - column:
                name: state
                type: varchar(16)
                defaultValue: "'ok'"
                constraint:
                    nullable: false
            - column:
                name: last_seen
                type: timestamptz
            - column:
                name: since
                type: timestamptz
            - column:
                name: attempt
                type: int
                defaultValue: "0"
                constraint:
                    nullable: false
          triggers:
            - trigger:
                name: "@extschema@_rppd_cron_event"
                event: after insert or update or delete
                when: for each row
                proc: "@extschema@.rppd_event()"

      # ── [breaker] the breaker's state per function per node ──────────────
      - table:
          tableName: rppd_function_state
          description: >
            One row per function per node, written by that node only, on the
            transitions of the breaker - readable with SQL, read back on a restart
            (an open breaker stays open until its back-off ends)
          columns:
            - column:
                name: fn_id
                type: int
                constraint:
                    primaryKey: true
                    nullable: false
            - column:
                name: node_id
                type: int
                constraint:
                    primaryKey: true
                    nullable: false
                description: rppd_config.id of the node
            - column:
                name: state
                type: varchar(8)
                defaultValue: "'closed'"
                constraint:
                    nullable: false
                description: closed, open or half
            - column:
                name: since
                type: timestamptz
                description: When the current state began
            - column:
                name: attempt
                type: int
                defaultValue: "0"
                constraint:
                    nullable: false
                description: Re-opens since the last close; the back-off doubles with each
            - column:
                name: last_error
                type: text
            - column:
                name: held
                type: int
                defaultValue: "0"
                constraint:
                    nullable: false
                description: Events held while not closed
            - column:
                name: limit_now
                type: int
                description: The adaptive limit of the shaper, written at most every 5 s while it moves
            - column:
                name: updated
                type: timestamptz
                defaultValue: current_timestamp
                constraint:
                    nullable: false
